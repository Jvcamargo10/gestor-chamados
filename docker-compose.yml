# API + PostgreSQL. O front roda à parte: cd frontend && npm run dev (proxy para a API em :3001)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chamados
      POSTGRES_PASSWORD: chamados
    ports: ["5432:5432"]
    volumes: ["dados:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    ports: ["3001:8080"]
    environment:
      DATABASE_URL: postgres://postgres:chamados@postgres:5432/chamados
      CORS_ORIGENS: http://localhost:5173
    depends_on: { postgres: { condition: service_healthy } }

volumes:
  dados:
